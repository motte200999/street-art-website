<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Street Art Paris – erlaubt oder unerlaubt?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik+Spray+Paint&family=Permanent+Marker&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="css/style.css?v=5">
</head>
<body>
<header class="top">
  <div class="brand">
    <span class="brand-main">STREET ART</span><span class="brand-sub">PARIS</span>
  </div>
  <nav class="nav" aria-label="Hauptmenü">
    <button data-view="map" class="active" data-i18n="nav_map"></button>
    <button data-view="stats" data-i18n="nav_stats"></button>
    <button data-view="about" data-i18n="nav_about"></button>
  </nav>
  <div class="lang" role="group" aria-label="Sprache">
    <button data-lang="de">DE</button><button data-lang="en">EN</button><button data-lang="fr">FR</button>
  </div>
</header>

<main>
  <section id="view-map" class="view active">
    <div id="map"></div>
    <div class="hint" id="hint" data-i18n="hint"></div>
    <div class="legend" id="legend"></div>
    <aside id="panel" class="panel" aria-live="polite"></aside>
  </section>

  <section id="view-stats" class="view page">
    <div class="page-inner" id="stats"></div>
  </section>

  <section id="view-about" class="view page">
    <div class="page-inner" id="about"></div>
  </section>
</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="data/arrondissements.js"></script>
<script src="data/pieces.js?v=5"></script>
<script src="js/i18n.js?v=5"></script>
<script src="js/app.js?v=5"></script>
</body>
</html>
